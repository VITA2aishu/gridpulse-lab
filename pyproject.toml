[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse-lab"
version = "0.1.0"
description = "A dependency-free real-time grid and BESS telemetry simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aisvarya Sampath Kumar"}]
keywords = ["bess", "grid", "telemetry", "scada", "energy"]

[project.scripts]
gridpulse = "gridpulse.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridpulse = ["web/*"]

